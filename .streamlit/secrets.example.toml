# RxShield Streamlit Secrets Example Configuration
# Copy this file to .streamlit/secrets.toml for local development.
# IMPORTANT: Never commit your real secrets.toml file to version control.
# Note: RxShield does NOT require any API keys for core safety checking.

# Optional: Supabase configuration for cloud user authentication & regimens
# SUPABASE_URL = "https://your-project-id.supabase.co"
# SUPABASE_ANON_KEY = "eyJhbGciOi..."

# Optional: Google Gemini API Key for grounded patient explanations
# GEMINI_API_KEY = "your-gemini-api-key"

# Optional: OpenAI API Key (alternative AI explanation provider)
# OPENAI_API_KEY = "your-openai-api-key"

# Optional: openFDA API Key (increases rate limits; not required)
# OPENFDA_API_KEY = "your-openfda-key"
